<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>FreshCart - Sign Up</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="overlay"
style="display:flex">

<div class="modal">

<h2>Create Account</h2>

<input
id="regName"
placeholder="Full Name">

<input
id="regEmail"
type="email"
placeholder="Email">

<input
id="regPassword"
type="password"
placeholder="Password">

<input
id="regPhone"
placeholder="Phone Number">

<button
class="primary"
style="width:100%"
onclick="register()">

Sign Up

</button>

<p style="margin-top:15px">

Already have an account?

<a href="index.html">
Login
</a>

</p>

</div>

</div>

<script src="js/user.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
